<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Baila Sin Control | Alberto Dorian</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Montserrat',sans-serif;
}

html{
scroll-behavior:smooth;
}

body{

background:
radial-gradient(circle at top,#5f0000 0%,#1b0000 35%,#000 100%);

overflow-x:hidden;

color:white;

padding:25px;

}

/************* PARTICULAS ************/

body::before{

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background-image:
radial-gradient(rgba(255,0,0,.25) 1px,transparent 1px);

background-size:40px 40px;

animation:particles 30s linear infinite;

pointer-events:none;

opacity:.45;

}

@keyframes particles{

from{

transform:translateY(0);

}

to{

transform:translateY(-500px);

}

}

/************* CONTENEDOR ************/

.card{

max-width:500px;

margin:auto;

text-align:center;

backdrop-filter:blur(18px);

}

/************* PORTADA ************/

.cover{

width:100%;

border-radius:26px;

box-shadow:

0 0 30px rgba(255,0,0,.55),

0 0 80px rgba(255,0,0,.15);

animation:cover 4s ease-in-out infinite;

}

@keyframes cover{

0%{

transform:translateY(0);

}

50%{

transform:translateY(-10px);

}

100%{

transform:translateY(0);

}

}

/************* TITULOS ************/

h1{

font-size:56px;

margin-top:30px;

font-weight:900;

letter-spacing:1px;

}

.artist{

margin-top:12px;

margin-bottom:35px;

font-size:23px;

color:#c7c7c7;

font-weight:300;

}

</style>

</head>
