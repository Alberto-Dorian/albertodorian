<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Baila Sin Control | Alberto Dorian</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
radial-gradient(circle at top,#750000,#220000,#000);

color:#fff;

overflow-x:hidden;

}

body::before{

content:"";

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:
radial-gradient(rgba(255,0,0,.12) 1px,transparent 1px);

background-size:28px 28px;

animation:fondo 18s linear infinite;

pointer-events:none;

}

@keyframes fondo{

from{
transform:translateY(0);
}

to{
transform:translateY(-28px);
}

}

.card{

max-width:520px;

margin:auto;

padding:30px 20px 60px;

text-align:center;

}

.cover{

width:100%;

border-radius:24px;

box-shadow:
0 0 25px rgba(255,0,0,.45),
0 0 60px rgba(255,0,0,.15);

animation:portada 3s ease-in-out infinite;

}

@keyframes portada{

0%{
transform:scale(1);
}

50%{
transform:scale(1.02);
}

100%{
transform:scale(1);
}

}

h1{

font-size:54px;

margin-top:25px;

font-weight:900;

}

.artist{

margin-top:12px;

font-size:24px;

color:#bdbdbd;

margin-bottom:35px;

}

.button{

display:flex;
align-items:center;
justify-content:center;
gap:12px;

width:100%;

padding:20px;

margin:16px 0;

border-radius:18px;

text-decoration:none;

font-size:22px;

font-weight:bold;

color:#fff;

background:#202020;

transition:.35s;

box-shadow:
0 0 15px rgba(255,0,0,.12);

animation:flotar 3s ease-in-out infinite;

}

.button:hover{

transform:translateY(-4px) scale(1.03);

box-shadow:
0 0 25px rgba(255,0,0,.45);

}

.spotify{

background:#d60000;

}

.apple{

background:#252525;

}

.youtube{

background:#202020;

}

.amazon{

background:#202020;

}

.audiomack{

background:#202020;

}

.x{

background:#202020;

}

.instagram{

background:#202020;

}

@keyframes flotar{

0%{
transform:translateY(0px);
}

50%{
transform:translateY(-3px);
}

100%{
transform:translateY(0px);
}

}

.section{

font-size:34px;

font-weight:bold;

margin:55px 0 25px;

}

.video{

width:100%;

aspect-ratio:16/9;

border:none;

border-radius:22px;

box-shadow:
0 0 30px rgba(255,0,0,.35);

}

.share{

margin-top:35px;

width:100%;

padding:18px;

border:none;

border-radius:18px;

background:#c00000;

color:#fff;

font-size:22px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.share:hover{

transform:scale(1.03);

}

.footer{

margin-top:35px;

color:#888;

font-size:14px;

}

</style>

</head>

<body>

<div class="card">

<img class="cover"
src="https://www.image2url.com/r2/default/images/1785564029012-1d174236-78fc-4918-9325-395ebb31d281.png"
alt="Baila Sin Control">

<h1>Baila Sin Control</h1>

<p class="artist">Alberto Dorian</p>

<a class="button spotify"
href="https://open.spotify.com/artist/05JuuguaTxtV2HAIijE2MU?si=copvURMVS7uYpx7i_yv_kA&utm_source=copy-link"
target="_blank">
<i class="fab fa-spotify"></i>
Spotify
</a>

<a class="button apple"
href="https://music.apple.com/mx/artist/alberto-dorian/6787090805"
target="_blank">
<i class="fab fa-apple"></i>
Apple Music
</a>

<a class="button youtube"
href="https://youtube.com/channel/UCjXlB41vOG5PU0M3wrKzEWw?si=8U6mJnnVnQ4GEb7C"
target="_blank">
<i class="fab fa-youtube"></i>
YouTube Music
</a>

<a class="button amazon"
href="https://music.amazon.com.mx/artists/B0H7NWRDQH?ref=dm_sh_iRR9prsm5MN0V2XJry0nsYsx3"
target="_blank">
<i class="fab fa-amazon"></i>
Amazon Music
</a>

<a class="button audiomack"
href="https://audiomack.com/alberto-dorian/song/ritmo-tumbabeat"

<a class="button x"

<i class="fa-brands fa-x-twitter"></i>
X
</a>

<a class="button instagram"
href="https://www.instagram.com/albertodorianmusic"
target="_blank">
<i class="fab fa-instagram"></i>
Instagram

<div class="section">
🎬 Video Oficial
</div>

<iframe
class="video"
src="https://www.youtube.com/embed/eIcZxNtSaDs"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

<button class="share" onclick="compartir()">
📤 Compartir
</button>

<div class="footer">
© 2026 Alberto Dorian
</div>

</div>

<script>

function compartir(){

if(navigator.share){

navigator.share({
title:"Baila Sin Control",
text:"Escucha el nuevo sencillo de Alberto Dorian",
url:window.location.href
});

}else{

navigator.clipboard.writeText(window.location.href);

alert("¡Link copiado!");

}

}

</script>

</body>
</html>
